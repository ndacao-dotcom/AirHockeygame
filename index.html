<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>3D Air Hockey - 改良版（パック向き修正）</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:sans-serif;touch-action:none}
canvas{touch-action:none}
#score,#stageLabel{position:absolute;left:50%;transform:translateX(-50%);color:#fff;z-index:10}
#score{top:10px;font-size:20px}
#stageLabel{top:40px;font-size:16px;color:#ccc}
#menu,#settings,#message{position:absolute;inset:0;display:none;justify-content:center;align-items:center;flex-direction:column;background:rgba(0,0,0,.75);color:#fff;z-index:20}
button{padding:12px 24px;font-size:16px;margin:8px}
select{font-size:16px;margin:4px}
h2{margin:8px 0}
</style>
</head>
<body>
<div id="score">0 : 0</div>
<div id="stageLabel">STAGE 1</div>

<div id="menu">
  <h1>3Dエアホッケー</h1>
  <button onclick="startAdventure()">アドベンチャーモード</button>
  <button onclick="alert('未実装')">ともだちと対戦</button>
  <button onclick="openSettings()">環境設定</button>
</div>

<div id="settings">
  <h2>環境設定</h2>
  マレット色<br>
  <select id="malletColor">
    <option value="red">赤</option>
    <option value="blue">青</option>
    <option value="green">緑</option>
    <option value="yellow">黄色</option>
  </select><br>
  パック色<br>
  <select id="puckColor">
    <option value="white">白</option>
    <option value="black">黒</option>
  </select><br>
  フィールド色<br>
  <select id="fieldColor">
    <option value="white">白</option>
    <option value="black">黒</option>
    <option value="court">コート</option>
  </select><br>
  <button onclick="applySettings()">決定</button>
  <button onclick="showMenu()">戻る</button>
</div>

<div id="message"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
/* ===== 基本 ===== */
let scene,camera,renderer;
let field,puck,player,cpu;
let puckVel=new THREE.Vector3();

let stage=1,MAX_STAGE=9;
let playerScore=0,cpuScore=0;
let gameActive=false;

/* ===== UI ===== */
const scoreEl=document.getElementById('score');
const stageEl=document.getElementById('stageLabel');
const menu=document.getElementById('menu');
const settings=document.getElementById('settings');
const message=document.getElementById('message');

/* ===== 操作 ===== */
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const playPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);

/* ===== サウンド（無くても動作） ===== */
const hitSound=new Audio('hit.mp3');
const goalSound=new Audio('goal.mp3');
hitSound.volume=0.6;
goalSound.volume=0.7;

/* ===== ボス名配列（ステージ番号に対応） ===== */
const bossNames = [
  null,
  null, // 1
  null, // 2
  null, // 3
  null, // 4
  null, // 5
  null, // 6
  null, // 7
  'やまだたろう',        // 8 ラスボス
  'バック・パック・三郎' // 9 最終ボス
];

/* ===== 初期化 ===== */
init();
showMenu();
animate();

function init(){
  scene=new THREE.Scene();

  camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);
  camera.position.set(0,7,7);
  camera.lookAt(0,0,0);

  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff,0.4));
  const light=new THREE.DirectionalLight(0xffffff,0.9);
  light.position.set(0,10,5);
  scene.add(light);

  field=new THREE.Mesh(
    new THREE.BoxGeometry(6,0.2,10),
    new THREE.MeshStandardMaterial({color:0x004488,metalness:0.2,roughness:0.6})
  );
  field.position.y=-0.1;
  scene.add(field);

  // パック（向き修正: 回転を 0 にする）
  puck=new THREE.Mesh(
    new THREE.CylinderGeometry(0.25,0.25,0.1,32),
    new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.3,roughness:0.4})
  );
  // ここを Math.PI/2 から 0 に変更（円形の面が上下を向く）
  puck.rotation.x = 0;
  scene.add(puck);

  // マレット（豪華デザイン）
  player=createMallet(0xff0000);
  cpu=createMallet(0x00ff00);
  scene.add(player);
  scene.add(cpu);

  /* 入力 */
  renderer.domElement.addEventListener('mousemove',e=>{
    if(gameActive) movePlayerByScreen(e.clientX,e.clientY);
  });

  renderer.domElement.addEventListener('touchstart',e=>{
    if(!gameActive) return;
    const t=e.touches[0];
    movePlayerByScreen(t.clientX,t.clientY);
    e.preventDefault();
  },{passive:false});

  renderer.domElement.addEventListener('touchmove',e=>{
    if(!gameActive) return;
    const t=e.touches[0];
    movePlayerByScreen(t.clientX,t.clientY);
    e.preventDefault();
  },{passive:false});

  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

/* ===== 豪華マレット生成関数 ===== */
function createMallet(hexColor){
  const group=new THREE.Group();

  // メタリック本体
  const bodyMat=new THREE.MeshStandardMaterial({color:hexColor,metalness:0.8,roughness:0.25});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.2,32),bodyMat);
  body.position.y=0;
  group.add(body);

  // 上部の宝珠（光沢）
  const gemMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:hexColor,emissiveIntensity:0.15,metalness:0.6,roughness:0.1});
  const gem=new THREE.Mesh(new THREE.SphereGeometry(0.12,16,16),gemMat);
  gem.position.set(0,0.12,0);
  group.add(gem);

  // 装飾リング
  const ringMat=new THREE.MeshStandardMaterial({color:0x222222,metalness:0.9,roughness:0.2});
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.45,0.06,16,64),ringMat);
  ring.rotation.x=Math.PI/2;
  ring.position.y=0.02;
  group.add(ring);

  // エンブレム（小さな箱）
  const emblemMat=new THREE.MeshStandardMaterial({color:0xffff00,metalness:1,roughness:0.2});
  const emblem=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.02,0.12),emblemMat);
  emblem.position.set(0,0.11,0.28);
  emblem.rotation.x=0.2;
  group.add(emblem);

  // コライダー半径
  group.userData.colliderRadius=0.6;

  return group;
}

/* ===== 操作処理 ===== */
function movePlayerByScreen(x,y){
  pointer.x=(x/innerWidth)*2-1;
  pointer.y=-(y/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);

  const hit=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(playPlane,hit)){
    player.position.x=THREE.MathUtils.clamp(hit.x,-2.7,2.7);
    player.position.z=THREE.MathUtils.clamp(hit.z,0.3,4.3);
  }
}

/* ===== ゲーム進行 ===== */
function startAdventure(){
  stage=1;
  startStage();
}

function startStage(){
